name: Daily MLB Pipeline

on:
  schedule:
    # 13:00 UTC = 10:00 America/Sao_Paulo (BRT, UTC-3)
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-mlb-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          if [ -z "${ODDS_API_KEY}" ]; then
            echo "ODDS_API_KEY is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run daily pipeline
        run: python main.py

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-edge-output-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
